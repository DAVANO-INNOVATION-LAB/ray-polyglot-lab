[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-polyglot-lab"
version = "0.1.0"
description = "A tested Ray adapter for bounded Java and C++ batch workloads"
requires-python = ">=3.11"
dependencies = ["ray==2.60.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.12.2"]

[project.scripts]
ray-polyglot = "ray_polyglot.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: starts a real Ray runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
